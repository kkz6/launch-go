name: Docker

on:
  # Build, push, and deploy the API image only when a GitHub Release is
  # published. Day-to-day pushes to main are validated by the CI workflow
  # (lint / build / test / security) and no longer produce or deploy an
  # image — cutting a release (a semver tag like v1.2.3) is the single,
  # deliberate path to production.
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag the release image by full version, major.minor, and short sha.
          # `latest` is applied automatically (flavor latest=auto) to the newest
          # non-prerelease semver tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Contabo VPS is amd64. Drop arm64 from the prod path to halve build
          # time and image storage. Reinstate if/when we run arm CI agents.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            service=launch-api
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dispatch deploy to launch-deploy
        # Deploy published releases, but never prereleases (those are cut for
        # testing, not production).
        if: github.event.release.prerelease == false
        uses: peter-evans/repository-dispatch@v3
        with:
          # Fine-grained PAT with `Actions: Read & write` on kkz6/launch-deploy.
          # Stored as a secret in this repo. Never has push access to code.
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: kkz6/launch-deploy
          event-type: deploy-api
          client-payload: |
            {
              "image_tag": "${{ steps.meta.outputs.version }}",
              "source_repo": "${{ github.repository }}",
              "source_ref": "${{ github.ref_name }}",
              "source_sha": "${{ github.sha }}"
            }
