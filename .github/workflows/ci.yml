name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.25.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        # golangci-lint v2.x requires action v7+. v6 only supports v1.
        # Version pinned to v2.12.2 — the v2.1.6 prebuilt binary is
        # itself compiled against Go 1.24 and refuses Go 1.25 modules
        # with "the Go language version used to build golangci-lint
        # is lower than the targeted Go version". v2.12.2 is compiled
        # against Go 1.25+ and runs cleanly against this module.
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    # Tests are fully self-contained — service tests use in-memory
    # sqlite via gorm.io/driver/sqlite, and nothing else hits a live
    # DB. The previous MySQL+Redis service containers were dead weight
    # from the Laravel-era port (and outright wrong since the codebase
    # moved to Postgres). Removed; if any future test needs a live DB,
    # add a postgres service back here.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build API
        run: go build -o bin/api ./cmd/api

      - name: Build Console
        run: go build -o bin/console ./cmd/console

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  client-submodule:
    name: Client submodule up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Verify the `client` submodule (kkz6/launch-nuxt) is pinned to the
      # latest commit on its main branch. Reads the gitlink SHA from the
      # tree (no submodule checkout needed) and compares to the remote,
      # so a stale pin fails CI and the frontend shipped with the API is
      # never behind.
      #
      # launch-nuxt is PRIVATE, so the remote read needs auth. Provide a
      # CLIENT_REPO_TOKEN secret (a PAT / fine-grained token with
      # Contents: Read on kkz6/launch-nuxt) to enable the hard check. The
      # default GITHUB_TOKEN only covers this repo, so without the secret
      # the step can't resolve the remote and degrades to a warning
      # rather than blocking every build.
      - name: Verify client submodule is at latest launch-nuxt main
        env:
          CLIENT_REPO_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          pinned=$(git ls-tree HEAD client | awk '{print $3}')
          if [ -z "$pinned" ]; then
            echo "::error::could not resolve the client submodule gitlink"
            exit 1
          fi
          auth=""
          if [ -n "$CLIENT_REPO_TOKEN" ]; then
            auth="x-access-token:${CLIENT_REPO_TOKEN}@"
          fi
          latest=$(git ls-remote "https://${auth}github.com/kkz6/launch-nuxt.git" refs/heads/main 2>/dev/null | awk '{print $1}')
          echo "pinned client submodule: $pinned"
          echo "latest launch-nuxt main:  ${latest:-<unresolved>}"
          if [ -z "$latest" ]; then
            echo "::warning::Could not read kkz6/launch-nuxt (private). Add a CLIENT_REPO_TOKEN secret (Contents: Read on kkz6/launch-nuxt) to enforce the up-to-date check. Skipping."
            exit 0
          fi
          if [ "$pinned" != "$latest" ]; then
            echo "::error::client submodule ($pinned) is behind launch-nuxt main ($latest). Bump it: git submodule update --remote client && git add client && commit."
            exit 1
          fi
          echo "client submodule is at the latest launch-nuxt main."
