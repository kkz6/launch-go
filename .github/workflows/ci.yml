name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.25.10"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        # golangci-lint v2.x requires action v7+. v6 only supports v1.
        # Version pinned to v2.12.2 — the v2.1.6 prebuilt binary is
        # itself compiled against Go 1.24 and refuses Go 1.25 modules
        # with "the Go language version used to build golangci-lint
        # is lower than the targeted Go version". v2.12.2 is compiled
        # against Go 1.25+ and runs cleanly against this module.
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    # Tests are fully self-contained — service tests use in-memory
    # sqlite via gorm.io/driver/sqlite, and nothing else hits a live
    # DB. The previous MySQL+Redis service containers were dead weight
    # from the Laravel-era port (and outright wrong since the codebase
    # moved to Postgres). Removed; if any future test needs a live DB,
    # add a postgres service back here.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build API
        run: go build -o bin/api ./cmd/api

      - name: Build Worker
        run: go build -o bin/worker ./cmd/worker

      - name: Build Migrate
        run: go build -o bin/migrate ./cmd/migrate

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
