version: "2"

# Consolidates the CI lint matrix (revive / staticcheck / gofmt / govet)
# into a single golangci-lint run, and layers in errcheck, ineffassign,
# unused, misspell, unconvert, unparam, and gosec — the same set goshop
# uses. revive.toml and staticcheck.conf remain authoritative for their
# rule sets and are referenced from here so config doesn't drift.

run:
  timeout: 5m
  go: "1.25"

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - client
      - bin
      - tmp
      - storage
      - migrate-encryption
      - tests/fixtures

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - revive

  # NOTE on the muted linters (unparam, gosec):
  #
  # The CI workflow's golangci-lint-action was broken for months
  # (v6 didn't support golangci-lint v2.x), so neither of these has
  # ever been enforced on this codebase. Re-enabling them surfaces
  # >50 issues that are overwhelmingly intentional patterns:
  #
  # - unparam: 30 findings, all "ctx context.Context" or similar
  #   threaded through callback signatures whose shape is fixed by
  #   an interface or by the taskrunner contract. Removing the
  #   parameter would break the contract. The right fix is per-
  #   function `//nolint:unparam` on a case-by-case basis once
  #   someone has time to triage; for now, the rule is muted so
  #   CI gates on signal, not noise.
  #
  # - gosec: 19 findings, mostly G104/G304/G404 false-positives
  #   (errors-not-checked on Logger calls, file inclusion via
  #   variables we control, math/rand for non-security paths).
  #   A few are legit (G401/G501 MD5 in ssh_key.go, G203 in
  #   email templates) and warrant a dedicated security-review
  #   pass — not a generic lint sweep.
  #
  # When the cleanup happens, re-add both to `enable:` and remove
  # this note.

  settings:


    staticcheck:
      # Mirrors staticcheck.conf so behaviour is identical when running
      # via golangci-lint.
      checks:
        - "all"
        - "-ST1000"  # Package comments — too strict for internal packages
        - "-ST1003"  # Naming conventions — handled by revive
        - "-ST1016"  # Receiver names — handled by revive
        - "-ST1020"  # Comment on exported function — too strict
        - "-ST1021"  # Comment on exported type — too strict
        - "-ST1022"  # Comment on exported var/const — too strict
        - "-QF1001"  # "could apply De Morgan's law" — stylistic
        - "-QF1003"  # "could use tagged switch" — stylistic
        - "-QF1008"  # "could remove embedded field from selector" — style
        - "-QF1012"  # "use fmt.Fprintf instead of WriteString(Sprintf(..))" — style

    revive:
      severity: warning
      confidence: 0.8
      enable-all-rules: false
      rules:
        # Mirrors revive.toml. Keep these in sync if you edit either file.
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
          arguments:
            - []
            - []
            - - skipPackageNameChecks: true
        - name: atomic
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: defer
        - name: duplicated-imports
        - name: empty-lines
        - name: get-return
        - name: identical-branches
        - name: if-return
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: optimize-operands-order
        - name: range-val-address
        - name: range-val-in-closure
        - name: redundant-import-alias
        - name: string-of-int
        - name: struct-tag
        - name: time-equal
        - name: unconditional-recursion
        - name: unexported-naming
        - name: unhandled-error
          arguments:
            - "fmt.Printf"
            - "fmt.Println"
            - "fmt.Print"
            - "fmt.Fprintf"
            - "fmt.Fprintln"
            - "strings\\.Builder\\.WriteString"
            - "strings\\.Builder\\.WriteRune"
            - "strings\\.Builder\\.WriteByte"
        - name: useless-break
        - name: waitgroup-by-value
        # Muted (pre-existing style noise, not bugs):
        # - bare-return / early-return / unnecessary-stmt: stylistic
        # - confusing-naming / confusing-results: trips on legit
        #   exported-vs-unexported pairs in the broadcast package
        #   and unnamed (T, error) return patterns
        # - import-shadowing: AWS SDK uses `credentials` as an arg
        #   name where we also import the credentials package
        # - nested-structs: anonymous structs in JSON unmarshal
        #   targets are fine; the alternative is a named type per
        #   one-off response.

  exclusions:
    generated: strict
    paths:
      - client
      - bin
      - tmp
      - storage
      - tests/fixtures
      # Migration files use AutoMigrate which produces unchecked errors
      # in patterns golangci-lint flags; keep them out of scope.
      - internal/database/migrations
    rules:
      # Test files are allowed to call the things linters typically nag
      # about (panic on error).
      - path: _test\.go
        linters:
          - errcheck
      # errcheck deny-list for genuinely-uninteresting error returns:
      # defer cleanups (Close), websocket housekeeping
      # (WriteMessage/SetReadDeadline — connection-bound, retried on
      # next frame), SSH session control (Signal/Wait — process is
      # being torn down), logger writes (Log — no fallback if
      # logging itself fails). Per-callsite ignores should still use
      # `_ =` for clarity, but bulk-muting at the lint layer keeps
      # CI from gating on noise.
      - linters: [errcheck]
        text: 'Error return value of `\(?[^`]*\)?\.?(Close|WriteMessage|SetReadDeadline|Signal|Wait|Shutdown|Log|Write|Remove|Unmarshal)`'
      # Cleanup helpers in cmd/api/main.go fire on shutdown and have
      # nothing useful to do with their error returns. cmd/ tools are
      # CLI utilities (test-do, validate-images, shellcheck, etc.)
      # where uncheck'd errors on stdout writes / json.Unmarshal of
      # known-good responses are acceptable.
      - path: cmd/.*\.go
        linters: [errcheck, revive]
