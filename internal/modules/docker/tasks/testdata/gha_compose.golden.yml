# Managed by Launch. Edits will be overwritten on the next sync.
name: Launch Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: launch-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      # yq extracts services with a `build:` directive. The result is a
      # JSON array of service names, fed into the matrix below. If the
      # compose file declares no `build:` (everything is `image:`), the
      # matrix is empty and the build job is skipped — the user picked
      # an all-prebuilt-images compose so there's nothing for GHA to do.
      - name: Install yq
        run: sudo snap install yq || (sudo curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq)

      - name: List buildable services
        id: list
        run: |
          services=$(yq -o=json '[.services | to_entries[] | select(.value.build != null) | .key]' "docker-compose.yml")
          echo "services=$services" >> $GITHUB_OUTPUT

  build:
    needs: discover
    if: ${{ needs.discover.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    outputs:
      image_map: ${{ steps.collect.outputs.image_map }}
    steps:
      - uses: actions/checkout@v4

      # buildx docker-container driver required for `cache-from/to:
      # type=gha`. The runner's default `docker` driver doesn't
      # support gha cache backends — without this step the build
      # dies with "Cache export is not supported for the docker
      # driver."
      - uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: meta
        run: |
          # GHCR rejects tags with uppercase letters in the repository
          # path ("repository name must be lowercase"). github.repository
          # preserves the original case (e.g. GlobalJapan/gj-hrms-api),
          # so we lowercase explicitly via bash ${VAR,,}. Keep this in
          # lock-step with the token-exchange step's
          # ${GITHUB_REPOSITORY,,} below.
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${REPO_LC}:launch-${{ matrix.service }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build context + Dockerfile
        id: ctx
        run: |
          context=$(yq -r ".services.\"${{ matrix.service }}\".build.context // \".\"" "docker-compose.yml")
          dockerfile=$(yq -r ".services.\"${{ matrix.service }}\".build.dockerfile // \"Dockerfile\"" "docker-compose.yml")
          echo "context=$context"       >> $GITHUB_OUTPUT
          echo "dockerfile=$dockerfile" >> $GITHUB_OUTPUT

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.context }}/${{ steps.ctx.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Each matrix shard appends its (service, image) pair to a shared
      # artifact. The collect job downstream rolls them into the JSON
      # map the notify call posts to Launch.
      - name: Record image
        run: |
          mkdir -p .gha-launch-images
          echo "${{ steps.meta.outputs.image }}" > ".gha-launch-images/${{ matrix.service }}"

      - uses: actions/upload-artifact@v4
        with:
          name: launch-image-${{ matrix.service }}
          path: .gha-launch-images/${{ matrix.service }}
          retention-days: 1

  collect-and-notify:
    needs: build
    runs-on: ubuntu-latest
    # 30 min (was 5): this job now blocks on the deploy itself via the
    # "Wait for Launch deploy to finish" step below, which holds the job
    # — and therefore the short-lived GHCR pull token it minted — open
    # until Launch's worker has finished pulling + deploying.
    timeout-minutes: 30
    # `packages: read` so the GHCR token-exchange step below can
    # mint a pull bearer. The build job has `packages: write` for
    # the per-service push; collect-and-notify only needs read.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: launch-image-*
          path: .gha-launch-images/
          merge-multiple: true

      - name: Build service_images map
        id: collect
        run: |
          map='{}'
          for f in .gha-launch-images/*; do
            svc=$(basename "$f")
            img=$(cat "$f")
            map=$(jq --arg svc "$svc" --arg img "$img" '. + {($svc): $img}' <<<"$map")
          done
          echo "service_images=$(echo "$map" | jq -c .)" >> $GITHUB_OUTPUT

      # Short-lived (~1h) GHCR pull bearer for the deploy host. See
      # the application template for the longer-form rationale; the
      # compose case publishes one package per service but they all
      # live under the same `<owner>/<repo>` GHCR namespace so one
      # bearer covers every service image.
      - name: Mint GHCR pull token
        id: ghcr_token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Docker Registry v2 Basic auth — see the application
          # template for the longer-form rationale.
          bearer=$(curl -fsSL \
            -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${GITHUB_REPOSITORY,,}:pull" \
            | jq -r '.token // empty')
          if [ -z "$bearer" ]; then
            echo "::error::Failed to mint GHCR pull token"
            exit 1
          fi
          echo "::add-mask::$bearer"
          {
            echo "bearer<<LAUNCH_BEARER_EOF"
            echo "$bearer"
            echo "LAUNCH_BEARER_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "minted_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Notify Launch (success)
        id: notify
        env:
          TOKEN: ${{ secrets.LAUNCH_DEPLOY_TOKEN }}
          GHCR_BEARER: ${{ steps.ghcr_token.outputs.bearer }}
          GHCR_BEARER_MINTED_AT: ${{ steps.ghcr_token.outputs.minted_at }}
        run: |
          resp=$(curl --fail-with-body -sS --connect-timeout 10 --max-time 30 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --argjson images    '${{ steps.collect.outputs.service_images }}' \
              --arg sha           '${{ github.sha }}' \
              --arg branch        '${{ github.ref_name }}' \
              --arg run_id        '${{ github.run_id }}' \
              --arg url           '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
              --arg pull          "$GHCR_BEARER" \
              --arg minted_at     "$GHCR_BEARER_MINTED_AT" \
              '{service_images:$images, commit_sha:$sha, branch:$branch, run_id:$run_id, run_url:$url, ghcr_pull_token:$pull, ghcr_pull_token_minted_at:$minted_at}')" \
            "${{ vars.LAUNCH_WEBHOOK_URL }}/api/webhooks/docker/composes/01HJXVHGRGTQRX4P0G3Y8R6CK8/deploy") \
            || { echo "::error::Launch rejected the deploy notify"; echo "$resp"; exit 1; }
          echo "$resp"
          deployment_id=$(printf '%s' "$resp" | jq -r '.data.deployment_id // empty')
          if [ -z "$deployment_id" ]; then
            echo "::error::Launch accepted the notify but returned no deployment_id; cannot wait for completion"
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      # Block until the deploy lands. The relayed GHCR bearer is only
      # valid while this job runs (GitHub revokes the run's GITHUB_TOKEN
      # — and tokens minted from it — when the job ends), so we must hold
      # the job open until the worker has pulled every service image.
      # Without this the async pull races job-teardown and fails with
      # "unauthenticated: User cannot be authenticated with the token
      # provided." See the application template for the full rationale.
      - name: Wait for Launch deploy to finish
        # Hard wall-clock cap regardless of the loop — a wedged poll must
        # not hold the runner for the whole job budget.
        timeout-minutes: 22
        env:
          TOKEN: ${{ secrets.LAUNCH_DEPLOY_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.notify.outputs.deployment_id }}
        run: |
          set -uo pipefail
          url="${{ vars.LAUNCH_WEBHOOK_URL }}/api/webhooks/docker/composes/01HJXVHGRGTQRX4P0G3Y8R6CK8/deployments/${DEPLOYMENT_ID}"
          # Upper bound on a healthy-but-slow deploy; under the step timeout
          # so the loop exits cleanly with a message first.
          deadline=$(( $(date +%s) + 1200 ))   # 20 min
          # Fail FAST if Launch itself is unreachable/erroring — a broken
          # backend must not keep this Action alive for the whole window.
          # Brief blips are tolerated; a sustained outage bails.
          fails=0
          max_fails=10
          while :; do
            resp=$(curl -sS --connect-timeout 10 --max-time 20 -w $'\n%{http_code}' \
              -H "Authorization: Bearer $TOKEN" "$url" || true)
            http=$(printf '%s' "$resp" | tail -n1); http=${http:-000}
            body=$(printf '%s' "$resp" | sed '$d')
            if [ "$http" = "200" ]; then
              fails=0
              status=$(printf '%s' "$body" | jq -r '.data.status // empty' 2>/dev/null || true)
              echo "deploy status: ${status:-<pending>}"
              case "$status" in
                success)
                  echo "Launch deploy succeeded."
                  exit 0 ;;
                failed|cancelled|timeout)
                  echo "::error::Launch deploy ${status}"
                  printf '%s' "$body" | jq -r '.data.error // empty' 2>/dev/null || true
                  exit 1 ;;
              esac
            else
              fails=$(( fails + 1 ))
              echo "::warning::deploy status check failed (HTTP ${http}, ${fails}/${max_fails})"
              if [ "$fails" -ge "$max_fails" ]; then
                echo "::error::Launch status endpoint unreachable/erroring — aborting so this run doesn't hang."
                exit 1
              fi
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for Launch deploy to finish"
              exit 1
            fi
            sleep 5
          done

  notify-failure:
    needs: [discover, build, collect-and-notify]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Launch (failure)
        env:
          TOKEN: ${{ secrets.LAUNCH_DEPLOY_TOKEN }}
        run: |
          curl -sS --connect-timeout 10 --max-time 30 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg run_id '${{ github.run_id }}' \
              --arg url    '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
              '{status:"failed", run_id:$run_id, run_url:$url}')" \
            "${{ vars.LAUNCH_WEBHOOK_URL }}/api/webhooks/docker/composes/01HJXVHGRGTQRX4P0G3Y8R6CK8/status" || true
