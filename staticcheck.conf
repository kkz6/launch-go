# Staticcheck configuration
# https://staticcheck.io/docs/configuration

# Select which checks to enable
# ST = stylecheck, S = simple, SA = staticcheck, QF = quickfix
checks = [
    "all",
    "-ST1000",  # Package comments - too strict for internal packages
    "-ST1003",  # Naming conventions - handled by revive
    "-ST1016",  # Receiver names - handled by revive
    "-ST1020",  # Comment on exported function - too strict
    "-ST1021",  # Comment on exported type - too strict
    "-ST1022",  # Comment on exported var/const - too strict
]

# Set the Go version to enable version-specific checks
go = "1.25.0"

# Increase parallelism for faster analysis
# Set to 0 to use all available cores
dot_import_whitelist = []

# Packages to exclude from analysis
# http_status_code_whitelist is deprecated, use initialisms instead
initialisms = [
    "ACL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP",
    "HTTPS", "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL",
    "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "GID", "UID", "UUID", "URI",
    "URL", "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS", "SIP", "RTP", "AMQP",
    "DB", "TS"
]
